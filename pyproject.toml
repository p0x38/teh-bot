[project]
name = "teh-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "discord-py>=2.7.1",
    "dpytest>=0.7.0",
    "fluent-runtime>=0.4.0",
    "orjson>=3.11.8",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pytest[asyncio]>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "pytest-xdist>=3.8.0",
    "rapidfuzz>=3.14.5",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.15.1",
    "dpytest>=0.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]


[project.scripts]
export = "scripts.export_scripts:main"
start = "src.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "semver"
tag_format = "v$version"
update_map_description = true
major_version_zero = true
version = "0.10.1"
change_type_choices = [
    { value = "feat", name = "feat: A new feature. Correlates with MINOR in SemVer" },
    { value = "fix", name = "fix: A bug fix. Correlates with PATCH in SemVer" },
    { value = "chore", name = "chore: Maintenance, build processes, or auxiliary tool changes" },
    { value = "refactor", name = "refactor: A code change that neither fixes a bug nor adds a feature" },
    { value = "docs", name = "docs: Documentation only changes" },
    { value = "style", name = "style: Changes that do not affect the meaning of the code" },
    { value = "perf", name = "perf: A code change that improves performance" },
    { value = "test", name = "test: Adding missing or correcting existing tests" }
]

[tool.commitizen.customize]
example_scopes = ["i18n", "plugin", "db", "leveling", "bot", "utils", "config", "scripts"]

[tool.commitizen.changelog]
template = "keepchangelog"
sections = [
    { value = "feat", label = "Features" },
    { value = "fix", label = "Bug Fixes" },
    { value = "refactor", label = "Refactors" },
    { value = "perf", label = "Performance" },
    { value = "build", label = "Build-System" },
    { value = "chore", label = "Others" },
    { value = "docs", label = "Documentation" },
    { value = "test", label = "Tests" }
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "native"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.uv]
managed = true
