[project]
name = "teh-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "discord-py>=2.7.1",
    "dpytest>=0.7.0",
    "fluent-runtime>=0.4.0",
    "orjson>=3.11.8",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "pytest-xdist>=3.8.0",
    "rapidfuzz>=3.14.5",
    "watchdog>=6.0.0",
    "distro>=1.9.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "vcs"}
]
lint = [
    "ruff>=0.15.12",
]
vcs = [
    "git-cliff>=2.13.1",
]
test = [
    "dpytest>=0.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]


[project.scripts]
export = "scripts.export_scripts:main"
start = "src.main:run"

[project.optional-dependencies]
voice = [
    "discord-py[voice]>=2.7.1",
]
speech = [
    "edge-tts>=7.2.8",
    "gtts>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "native"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.uv]
managed = true
default-groups = "all"
